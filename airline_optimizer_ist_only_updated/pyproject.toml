[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-optimizer"
version = "0.1.0"
description = "Flight departure-time optimization with dynamic connection evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
airline-optimizer = "airline_optimizer.cli:main"

[project.optional-dependencies]
data = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
